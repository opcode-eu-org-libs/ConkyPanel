local out_to_x = false
local out_to_wayland = false
local XDG_SESSION_TYPE = os.getenv("XDG_SESSION_TYPE")

if XDG_SESSION_TYPE == "x11" then
    out_to_x = true
elseif XDG_SESSION_TYPE == "wayland" then
    out_to_wayland = true
else
    print("No supported output, XDG_SESSION_TYPE=" .. XDG_SESSION_TYPE)
end

